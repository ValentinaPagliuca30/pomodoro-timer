<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v21: Hourglass Flow</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Palatino', 'Book Antiqua', serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ecf0f1;
            position: relative;
            overflow: hidden;
        }

        /* Animated stars background */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .container {
            text-align: center;
            max-width: 700px;
            padding: 40px;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 400;
            margin-bottom: 50px;
            color: #ffd700;
            font-style: italic;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5),
                         0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .hourglass-container {
            width: 200px;
            height: 350px;
            margin: 0 auto 40px;
            position: relative;
            filter: drop-shadow(0 10px 40px rgba(212, 175, 55, 0.3));
        }

        /* Wooden frame */
        .frame-top, .frame-bottom {
            position: absolute;
            width: 100%;
            height: 30px;
            background: linear-gradient(135deg, #8B4513 0%, #A0522D 50%, #8B4513 100%);
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3),
                        inset 0 2px 0 rgba(255,255,255,0.2),
                        inset 0 -2px 0 rgba(0,0,0,0.3);
        }

        .frame-top { top: 0; }
        .frame-bottom { bottom: 0; }

        /* Glass bulbs */
        .hourglass {
            position: absolute;
            top: 30px;
            left: 25px;
            width: 150px;
            height: 290px;
            background: rgba(255, 255, 255, 0.05);
            clip-path: polygon(
                20% 0%, 80% 0%,
                80% 45%, 50% 50%,
                20% 45%, 20% 0%,
                20% 45%, 50% 50%,
                80% 45%, 80% 100%,
                20% 100%, 20% 45%
            );
        }

        /* Glass shine effect */
        .glass-shine {
            position: absolute;
            top: 30px;
            left: 25px;
            width: 150px;
            height: 290px;
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(255,255,255,0.1) 30%,
                rgba(255,255,255,0.2) 50%,
                rgba(255,255,255,0.1) 70%,
                transparent 100%);
            clip-path: polygon(
                20% 0%, 80% 0%,
                80% 45%, 50% 50%,
                20% 45%
            );
            pointer-events: none;
        }

        /* Sand containers */
        .sand-container {
            position: absolute;
            top: 30px;
            left: 25px;
            width: 150px;
            height: 290px;
            overflow: hidden;
        }

        .sand-top {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to bottom, #ffd700, #f39c12, #e67e22);
            transition: height 1s linear;
            clip-path: polygon(20% 0%, 80% 0%, 80% 100%, 20% 100%);
        }

        .sand-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 0%;
            background: linear-gradient(to bottom, #e67e22, #f39c12, #ffd700);
            transition: height 1s linear;
            clip-path: polygon(20% 0%, 80% 0%, 80% 100%, 20% 100%);
        }

        /* Sand falling particles */
        .sand-stream {
            position: absolute;
            top: 130px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 30px;
            background: linear-gradient(to bottom, rgba(255, 215, 0, 0.8), transparent);
            opacity: 0;
            transition: opacity 0.5s;
        }

        .sand-stream.active {
            opacity: 1;
            animation: sandFall 2s linear infinite;
        }

        @keyframes sandFall {
            0% { height: 0px; opacity: 0.8; }
            100% { height: 30px; opacity: 0; }
        }

        .timer-display {
            font-size: 8rem;
            font-weight: 200;
            margin-bottom: 25px;
            color: #ffd700;
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.6),
                         0 4px 20px rgba(0, 0, 0, 0.4);
            letter-spacing: -4px;
        }

        .timer-label {
            font-size: 1.4rem;
            margin-bottom: 60px;
            color: #c0c0c0;
            font-style: italic;
            letter-spacing: 1px;
        }

        .controls {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 50px;
        }

        button {
            background: rgba(255, 215, 0, 0.1);
            border: 2px solid #ffd700;
            color: #ffd700;
            padding: 20px 55px;
            font-size: 1.15rem;
            cursor: pointer;
            border-radius: 50px;
            font-weight: 600;
            font-family: 'Palatino', serif;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }

        button:hover {
            background: rgba(255, 215, 0, 0.2);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.4);
        }

        button#resetBtn {
            background: rgba(192, 192, 192, 0.1);
            border-color: #c0c0c0;
            color: #c0c0c0;
            box-shadow: 0 0 20px rgba(192, 192, 192, 0.2);
        }

        button#resetBtn:hover {
            background: rgba(192, 192, 192, 0.2);
            box-shadow: 0 10px 30px rgba(192, 192, 192, 0.3);
        }

        .sessions {
            font-size: 1.25rem;
            background: rgba(255, 215, 0, 0.1);
            padding: 20px 50px;
            border-radius: 30px;
            display: inline-block;
            border: 2px solid rgba(255, 215, 0, 0.4);
            color: #ffd700;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .sessions span {
            font-size: 3rem;
            font-weight: 700;
            display: block;
            margin-top: 10px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }
    </style>
</head>
<body>
    <!-- Animated stars -->
    <div class="stars" id="starsContainer"></div>

    <div class="container">
        <h1>⏳ Time Flows Like Sand</h1>

        <div class="hourglass-container">
            <div class="frame-top"></div>
            <div class="hourglass"></div>
            <div class="glass-shine"></div>
            <div class="sand-container">
                <div class="sand-top" id="sandTop"></div>
                <div class="sand-bottom" id="sandBottom"></div>
                <div class="sand-stream" id="sandStream"></div>
            </div>
            <div class="frame-bottom"></div>
        </div>

        <div class="timer-display" id="timer">25:00</div>
        <div class="timer-label" id="label">Watch the sand flow down</div>

        <div class="controls">
            <button id="startBtn">Start</button>
            <button id="resetBtn">Reset</button>
        </div>

        <div class="sessions">
            Hourglasses flipped
            <span id="sessions">0</span>
        </div>
    </div>

    <script>
        // Generate stars
        const starsContainer = document.getElementById('starsContainer');
        for (let i = 0; i < 100; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 3 + 's';
            star.style.animationDuration = (Math.random() * 2 + 2) + 's';
            starsContainer.appendChild(star);
        }

        let timeLeft = 25 * 60;
        let totalTime = 25 * 60;
        let isRunning = false;
        let isBreak = false;
        let sessionsCompleted = 0;
        let timerInterval;

        const timerDisplay = document.getElementById('timer');
        const labelDisplay = document.getElementById('label');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const sessionsDisplay = document.getElementById('sessions');
        const sandTop = document.getElementById('sandTop');
        const sandBottom = document.getElementById('sandBottom');
        const sandStream = document.getElementById('sandStream');

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

            // Update sand levels
            const progress = ((totalTime - timeLeft) / totalTime);
            const topHeight = (1 - progress) * 45; // Top bulb
            const bottomHeight = progress * 45; // Bottom bulb

            sandTop.style.height = topHeight + '%';
            sandBottom.style.height = bottomHeight + '%';

            // Show sand stream when timer is running
            if (isRunning && timeLeft > 0) {
                sandStream.classList.add('active');
            } else {
                sandStream.classList.remove('active');
            }
        }

        function startTimer() {
            if (isRunning) {
                isRunning = false;
                startBtn.textContent = 'Start';
                clearInterval(timerInterval);
            } else {
                isRunning = true;
                startBtn.textContent = 'Pause';
                timerInterval = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateDisplay();
                    } else {
                        clearInterval(timerInterval);
                        isRunning = false;

                        if (!isBreak) {
                            sessionsCompleted++;
                            sessionsDisplay.textContent = sessionsCompleted;
                            isBreak = true;
                            timeLeft = 5 * 60;
                            totalTime = 5 * 60;
                            labelDisplay.textContent = 'Brief pause, flip the glass';
                            startBtn.textContent = 'Start';
                        } else {
                            isBreak = false;
                            timeLeft = 25 * 60;
                            totalTime = 25 * 60;
                            labelDisplay.textContent = 'Watch the sand flow down';
                            startBtn.textContent = 'Start';
                        }
                        updateDisplay();
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            isBreak = false;
            timeLeft = 25 * 60;
            totalTime = 25 * 60;
            labelDisplay.textContent = 'Watch the sand flow down';
            startBtn.textContent = 'Start';
            updateDisplay();
        }

        startBtn.addEventListener('click', startTimer);
        resetBtn.addEventListener('click', resetTimer);

        updateDisplay();
    </script>
</body>
</html>
