<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v13: Crossy Road</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif;
            background: linear-gradient(to bottom, #87CEEB 0%, #98D8E8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        /* Road with lanes */
        .road {
            position: fixed;
            left: 0;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            height: 300px;
            background: repeating-linear-gradient(
                0deg,
                #4a4a4a 0px,
                #4a4a4a 45px,
                #ffeb3b 45px,
                #ffeb3b 50px,
                #4a4a4a 50px,
                #4a4a4a 95px,
                #ffeb3b 95px,
                #ffeb3b 100px
            );
            z-index: 0;
        }

        /* Grass strips */
        .grass-top, .grass-bottom {
            position: fixed;
            left: 0;
            right: 0;
            height: 150px;
            background: linear-gradient(135deg, #4CAF50 25%, #66BB6A 25%, #66BB6A 50%, #4CAF50 50%, #4CAF50 75%, #66BB6A 75%);
            background-size: 40px 40px;
            z-index: 0;
        }

        .grass-top {
            top: 0;
        }

        .grass-bottom {
            bottom: 0;
        }

        /* Chicken that moves across */
        .chicken {
            position: fixed;
            font-size: 4rem;
            bottom: 20%;
            left: 10%;
            transition: left 1s ease, transform 0.3s ease;
            z-index: 2;
            filter: drop-shadow(3px 3px 0 rgba(0,0,0,0.3));
        }

        /* Cars moving across road */
        .car {
            position: fixed;
            font-size: 3rem;
            animation: drive 8s linear infinite;
            z-index: 1;
            filter: drop-shadow(2px 2px 0 rgba(0,0,0,0.2));
        }

        .car1 { top: 38%; animation-duration: 6s; animation-delay: 0s; }
        .car2 { top: 48%; animation-duration: 9s; animation-delay: 2s; }
        .car3 { top: 58%; animation-duration: 7s; animation-delay: 4s; }

        @keyframes drive {
            0% { left: -100px; }
            100% { left: calc(100% + 100px); }
        }

        .container {
            text-align: center;
            max-width: 700px;
            padding: 40px;
            position: relative;
            z-index: 3;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 900;
            margin-bottom: 30px;
            color: #FF6B6B;
            text-shadow: 3px 3px 0 #FFE66D,
                         6px 6px 0 #4ECDC4;
        }

        .timer-display {
            font-size: 8rem;
            font-weight: 900;
            color: #4ECDC4;
            margin-bottom: 20px;
            line-height: 1;
            letter-spacing: -5px;
            text-shadow: 4px 4px 0 #FF6B6B;
        }

        .timer-label {
            font-size: 1.5rem;
            margin-bottom: 40px;
            color: #555;
            font-weight: 700;
        }

        .controls {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 40px;
        }

        button {
            background: #FF6B6B;
            border: none;
            color: #fff;
            padding: 20px 50px;
            font-size: 1.3rem;
            cursor: pointer;
            border-radius: 50px;
            font-weight: 900;
            transition: all 0.3s ease;
            box-shadow: 0 8px 0 #D64545,
                        0 10px 20px rgba(0,0,0,0.3);
            font-family: inherit;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 11px 0 #D64545,
                        0 13px 25px rgba(0,0,0,0.4);
        }

        button:active {
            transform: translateY(5px);
            box-shadow: 0 3px 0 #D64545,
                        0 5px 10px rgba(0,0,0,0.3);
        }

        button#resetBtn {
            background: #4ECDC4;
            box-shadow: 0 8px 0 #3AAFA9,
                        0 10px 20px rgba(0,0,0,0.3);
        }

        button#resetBtn:hover {
            box-shadow: 0 11px 0 #3AAFA9,
                        0 13px 25px rgba(0,0,0,0.4);
        }

        button#resetBtn:active {
            box-shadow: 0 3px 0 #3AAFA9,
                        0 5px 10px rgba(0,0,0,0.3);
        }

        .sessions {
            font-size: 1.3rem;
            background: #FFE66D;
            color: #333;
            padding: 15px 40px;
            border-radius: 20px;
            display: inline-block;
            font-weight: 900;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .sessions span {
            font-size: 3rem;
            color: #FF6B6B;
            display: block;
            margin-top: 5px;
            text-shadow: 2px 2px 0 #fff;
        }
    </style>
</head>
<body>
    <!-- Background elements -->
    <div class="grass-top"></div>
    <div class="road"></div>
    <div class="grass-bottom"></div>

    <!-- Chicken crossing -->
    <div class="chicken" id="chicken">🐔</div>

    <!-- Cars driving -->
    <div class="car car1">🚗</div>
    <div class="car car2">🚙</div>
    <div class="car car3">🚕</div>

    <div class="container">
        <h1>CROSS THE ROAD!</h1>

        <div class="timer-display" id="timer">25:00</div>
        <div class="timer-label" id="label">Hop to the finish line!</div>

        <div class="controls">
            <button id="startBtn">HOP</button>
            <button id="resetBtn">RESTART</button>
        </div>

        <div class="sessions">
            Roads crossed
            <span id="sessions">0</span>
        </div>
    </div>

    <script>
        let timeLeft = 25 * 60;
        let totalTime = 25 * 60;
        let isRunning = false;
        let isBreak = false;
        let sessionsCompleted = 0;
        let timerInterval;

        const timerDisplay = document.getElementById('timer');
        const labelDisplay = document.getElementById('label');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const sessionsDisplay = document.getElementById('sessions');
        const chicken = document.getElementById('chicken');

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

            // Move chicken across screen as timer progresses
            const progress = ((totalTime - timeLeft) / totalTime);
            chicken.style.left = (10 + progress * 80) + '%';

            // Make chicken hop slightly when moving
            if (progress > 0 && progress < 1) {
                chicken.style.transform = 'translateY(' + (Math.sin(progress * 50) * 5) + 'px)';
            }
        }

        function startTimer() {
            if (isRunning) {
                isRunning = false;
                startBtn.textContent = 'HOP';
                clearInterval(timerInterval);
            } else {
                isRunning = true;
                startBtn.textContent = 'PAUSE';
                timerInterval = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateDisplay();
                    } else {
                        clearInterval(timerInterval);
                        isRunning = false;

                        if (!isBreak) {
                            sessionsCompleted++;
                            sessionsDisplay.textContent = sessionsCompleted;
                            isBreak = true;
                            timeLeft = 5 * 60;
                            totalTime = 5 * 60;
                            labelDisplay.textContent = 'Safe zone! Take a break!';
                            startBtn.textContent = 'HOP';
                        } else {
                            isBreak = false;
                            timeLeft = 25 * 60;
                            totalTime = 25 * 60;
                            labelDisplay.textContent = 'Hop to the finish line!';
                            startBtn.textContent = 'HOP';
                        }
                        updateDisplay();
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            isBreak = false;
            timeLeft = 25 * 60;
            totalTime = 25 * 60;
            labelDisplay.textContent = 'Hop to the finish line!';
            startBtn.textContent = 'HOP';
            updateDisplay();
        }

        startBtn.addEventListener('click', startTimer);
        resetBtn.addEventListener('click', resetTimer);

        updateDisplay();
    </script>
</body>
</html>
