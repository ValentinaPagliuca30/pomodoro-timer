<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v22: Refined Animations</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 750px;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tomato-icon {
            font-size: 4rem;
            margin-bottom: 25px;
            animation: gentle-bounce 3s ease-in-out infinite;
            filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.2));
        }

        @keyframes gentle-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        h1 {
            font-size: 2.4rem;
            font-weight: 600;
            margin-bottom: 55px;
            color: #fff;
            opacity: 0;
            animation: slideIn 0.6s ease 0.2s forwards;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .timer-display {
            font-size: 10.5rem;
            font-weight: 200;
            color: #fff;
            margin-bottom: 35px;
            letter-spacing: -5px;
            text-shadow: 0 6px 25px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .timer-display.pulse {
            animation: subtle-pulse 1s ease;
        }

        @keyframes subtle-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .timer-label {
            font-size: 1.4rem;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 70px;
            font-weight: 400;
            transition: all 0.3s ease;
        }

        .controls {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 60px;
        }

        button {
            background: rgba(255, 255, 255, 0.95);
            border: none;
            color: #667eea;
            padding: 20px 58px;
            font-size: 1.08rem;
            cursor: pointer;
            border-radius: 15px;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-weight: 600;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.15);
        }

        button:hover {
            background: #fff;
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.22);
        }

        button:active {
            transform: translateY(-1px) scale(0.98);
            transition: all 0.1s ease;
        }

        button#resetBtn {
            background: rgba(255, 255, 255, 0.22);
            color: #fff;
        }

        button#resetBtn:hover {
            background: rgba(255, 255, 255, 0.32);
        }

        .sessions {
            font-size: 1.15rem;
            color: rgba(255, 255, 255, 0.9);
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(15px);
            padding: 18px 45px;
            border-radius: 28px;
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.25);
            transition: all 0.3s ease;
        }

        .sessions:hover {
            transform: translateY(-2px);
        }

        .sessions span {
            font-size: 2.8rem;
            font-weight: 600;
            color: #fff;
            display: block;
            margin-top: 10px;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="tomato-icon">🍅</div>
        <h1>Pomodoro Flow</h1>

        <div class="timer-display" id="timer">25:00</div>
        <div class="timer-label" id="label">Focus Time</div>

        <div class="controls">
            <button id="startBtn">Start</button>
            <button id="resetBtn">Reset</button>
        </div>

        <div class="sessions">
            Completed
            <span id="sessions">0</span>
        </div>
    </div>

    <script>
        let timeLeft = 25 * 60;
        let totalTime = 25 * 60;
        let isRunning = false;
        let isBreak = false;
        let sessionsCompleted = 0;
        let timerInterval;

        const timerDisplay = document.getElementById('timer');
        const labelDisplay = document.getElementById('label');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const sessionsDisplay = document.getElementById('sessions');

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

            // Add pulse effect when timer updates
            timerDisplay.classList.remove('pulse');
            void timerDisplay.offsetWidth; // Trigger reflow
            timerDisplay.classList.add('pulse');
        }

        function startTimer() {
            if (isRunning) {
                isRunning = false;
                startBtn.textContent = 'Start';
                clearInterval(timerInterval);
            } else {
                isRunning = true;
                startBtn.textContent = 'Pause';
                timerInterval = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateDisplay();
                    } else {
                        clearInterval(timerInterval);
                        isRunning = false;

                        if (!isBreak) {
                            sessionsCompleted++;
                            sessionsDisplay.textContent = sessionsCompleted;
                            isBreak = true;
                            timeLeft = 5 * 60;
                            totalTime = 5 * 60;
                            labelDisplay.textContent = 'Break Time';
                            startBtn.textContent = 'Start';
                        } else {
                            isBreak = false;
                            timeLeft = 25 * 60;
                            totalTime = 25 * 60;
                            labelDisplay.textContent = 'Focus Time';
                            startBtn.textContent = 'Start';
                        }
                        updateDisplay();
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            isBreak = false;
            timeLeft = 25 * 60;
            totalTime = 25 * 60;
            labelDisplay.textContent = 'Focus Time';
            startBtn.textContent = 'Start';
            updateDisplay();
        }

        startBtn.addEventListener('click', startTimer);
        resetBtn.addEventListener('click', resetTimer);

        updateDisplay();
    </script>
</body>
</html>
