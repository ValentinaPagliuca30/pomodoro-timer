<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v6: Retro 80s</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Press Start 2P', 'Courier New', monospace;
            background: linear-gradient(135deg, #ff006e 0%, #8338ec 50%, #3a86ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15) 0px,
                transparent 1px,
                transparent 2px,
                rgba(0, 0, 0, 0.15) 3px
            );
            pointer-events: none;
        }

        .container {
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 50px;
            border: 4px solid #ff006e;
            box-shadow: 0 0 50px rgba(255, 0, 110, 0.5),
                        inset 0 0 30px rgba(131, 56, 236, 0.3);
            position: relative;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 40px;
            color: #00f5ff;
            text-shadow: 3px 3px 0 #ff006e;
            letter-spacing: 3px;
        }

        .timer-display {
            font-size: 5rem;
            font-weight: 900;
            color: #00f5ff;
            margin-bottom: 25px;
            text-shadow: 4px 4px 0 #ff006e,
                         8px 8px 20px rgba(255, 0, 110, 0.6);
        }

        .timer-label {
            font-size: 0.9rem;
            color: #ffbe0b;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        .controls {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 40px;
        }

        button {
            background: #ff006e;
            border: 3px solid #00f5ff;
            color: #fff;
            padding: 15px 35px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.5);
            box-shadow: 0 5px 0 #8338ec;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 0 #8338ec,
                        0 0 20px rgba(255, 0, 110, 0.8);
        }

        button:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #8338ec;
        }

        .sessions {
            font-size: 0.85rem;
            color: #ffbe0b;
            letter-spacing: 2px;
            background: rgba(0, 0, 0, 0.5);
            padding: 12px 25px;
            border: 2px solid #ffbe0b;
            display: inline-block;
        }

        .sessions span {
            font-size: 1.5rem;
            color: #00f5ff;
            text-shadow: 2px 2px 0 #ff006e;
        }

        .grid {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 150px;
            background: linear-gradient(to bottom, transparent, rgba(131, 56, 236, 0.3)),
                        repeating-linear-gradient(
                            90deg,
                            transparent,
                            transparent 49px,
                            #ff006e 49px,
                            #ff006e 51px
                        ),
                        repeating-linear-gradient(
                            0deg,
                            transparent,
                            transparent 49px,
                            #ff006e 49px,
                            #ff006e 51px
                        );
            transform: perspective(500px) rotateX(60deg);
            transform-origin: bottom;
        }
    </style>
</head>
<body>
    <div class="grid"></div>
    <div class="container">
        <h1>STUDY TIME</h1>

        <div class="timer-display" id="timer">25:00</div>
        <div class="timer-label" id="label">WORK MODE</div>

        <div class="controls">
            <button id="startBtn">START</button>
            <button id="resetBtn">RESET</button>
        </div>

        <div class="sessions">
            SCORE: <span id="sessions">0</span>
        </div>
    </div>

    <script>
        let timeLeft = 25 * 60;
        let totalTime = 25 * 60;
        let isRunning = false;
        let isBreak = false;
        let sessionsCompleted = 0;
        let timerInterval;

        const timerDisplay = document.getElementById('timer');
        const labelDisplay = document.getElementById('label');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const sessionsDisplay = document.getElementById('sessions');

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function startTimer() {
            if (isRunning) {
                isRunning = false;
                startBtn.textContent = 'START';
                clearInterval(timerInterval);
            } else {
                isRunning = true;
                startBtn.textContent = 'PAUSE';
                timerInterval = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateDisplay();
                    } else {
                        clearInterval(timerInterval);
                        isRunning = false;

                        if (!isBreak) {
                            sessionsCompleted++;
                            sessionsDisplay.textContent = sessionsCompleted;
                            isBreak = true;
                            timeLeft = 5 * 60;
                            totalTime = 5 * 60;
                            labelDisplay.textContent = 'BREAK TIME';
                            startBtn.textContent = 'START';
                        } else {
                            isBreak = false;
                            timeLeft = 25 * 60;
                            totalTime = 25 * 60;
                            labelDisplay.textContent = 'WORK MODE';
                            startBtn.textContent = 'START';
                        }
                        updateDisplay();
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            isBreak = false;
            timeLeft = 25 * 60;
            totalTime = 25 * 60;
            labelDisplay.textContent = 'WORK MODE';
            startBtn.textContent = 'START';
            updateDisplay();
        }

        startBtn.addEventListener('click', startTimer);
        resetBtn.addEventListener('click', resetTimer);

        updateDisplay();
    </script>
</body>
</html>
