<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v16: iOS Clean</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: #f5f5f7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1d1d1f;
        }

        .container {
            text-align: center;
            max-width: 600px;
            padding: 60px;
            background: #fff;
            border-radius: 30px;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.08);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            margin-bottom: 50px;
            color: #1d1d1f;
        }

        .timer-display {
            font-size: 7.5rem;
            font-weight: 200;
            color: #1d1d1f;
            margin-bottom: 25px;
            letter-spacing: -2px;
        }

        .timer-label {
            font-size: 1.1rem;
            color: #86868b;
            margin-bottom: 60px;
            font-weight: 400;
        }

        .controls {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 50px;
        }

        button {
            background: #007aff;
            border: none;
            color: #fff;
            padding: 16px 45px;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        button:hover {
            background: #0051d5;
            transform: scale(1.02);
        }

        button:active {
            transform: scale(0.98);
        }

        button#resetBtn {
            background: #f5f5f7;
            color: #007aff;
        }

        button#resetBtn:hover {
            background: #e8e8ed;
        }

        .sessions {
            font-size: 1rem;
            color: #86868b;
            background: #f5f5f7;
            padding: 15px 35px;
            border-radius: 20px;
            display: inline-block;
        }

        .sessions span {
            font-size: 2rem;
            font-weight: 600;
            color: #1d1d1f;
            display: block;
            margin-top: 8px;
        }

        .progress-ring {
            width: 200px;
            height: 200px;
            margin: 0 auto 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f5f5f7, #e8e8ed);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .progress-inner {
            width: 180px;
            height: 180px;
            background: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #007aff;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Focus</h1>

        <div class="progress-ring">
            <div class="progress-inner" id="progress">0%</div>
        </div>

        <div class="timer-display" id="timer">25:00</div>
        <div class="timer-label" id="label">Work Session</div>

        <div class="controls">
            <button id="startBtn">Start</button>
            <button id="resetBtn">Reset</button>
        </div>

        <div class="sessions">
            Sessions Completed
            <span id="sessions">0</span>
        </div>
    </div>

    <script>
        let timeLeft = 25 * 60;
        let totalTime = 25 * 60;
        let isRunning = false;
        let isBreak = false;
        let sessionsCompleted = 0;
        let timerInterval;

        const timerDisplay = document.getElementById('timer');
        const labelDisplay = document.getElementById('label');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const sessionsDisplay = document.getElementById('sessions');
        const progressDisplay = document.getElementById('progress');

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

            const progress = Math.round(((totalTime - timeLeft) / totalTime) * 100);
            progressDisplay.textContent = progress + '%';
        }

        function startTimer() {
            if (isRunning) {
                isRunning = false;
                startBtn.textContent = 'Start';
                clearInterval(timerInterval);
            } else {
                isRunning = true;
                startBtn.textContent = 'Pause';
                timerInterval = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateDisplay();
                    } else {
                        clearInterval(timerInterval);
                        isRunning = false;

                        if (!isBreak) {
                            sessionsCompleted++;
                            sessionsDisplay.textContent = sessionsCompleted;
                            isBreak = true;
                            timeLeft = 5 * 60;
                            totalTime = 5 * 60;
                            labelDisplay.textContent = 'Break Time';
                            startBtn.textContent = 'Start';
                        } else {
                            isBreak = false;
                            timeLeft = 25 * 60;
                            totalTime = 25 * 60;
                            labelDisplay.textContent = 'Work Session';
                            startBtn.textContent = 'Start';
                        }
                        updateDisplay();
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            isBreak = false;
            timeLeft = 25 * 60;
            totalTime = 25 * 60;
            labelDisplay.textContent = 'Work Session';
            startBtn.textContent = 'Start';
            updateDisplay();
        }

        startBtn.addEventListener('click', startTimer);
        resetBtn.addEventListener('click', resetTimer);

        updateDisplay();
    </script>
</body>
</html>
