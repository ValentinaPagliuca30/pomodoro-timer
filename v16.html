<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v16: Daylight Journey</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: linear-gradient(to bottom, #87CEEB 0%, #FDB99B 50%, #FF6B6B 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            position: relative;
            overflow: hidden;
            transition: background 1s ease;
        }

        body.sunset {
            background: linear-gradient(to bottom, #FF6B6B 0%, #FDB99B 50%, #4A4E69 100%);
        }

        .sun {
            position: absolute;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, #FFD700 0%, #FFA500 100%);
            border-radius: 50%;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.6);
            transition: all 1s ease;
        }

        .clouds {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 100px;
            animation: float 20s linear infinite;
        }

        .cloud::before,
        .cloud::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 100px;
        }

        .cloud1 { width: 100px; height: 40px; top: 15%; left: -100px; animation-delay: 0s; }
        .cloud1::before { width: 50px; height: 40px; top: -20px; left: 15px; }
        .cloud1::after { width: 60px; height: 35px; top: -15px; right: 10px; }

        .cloud2 { width: 120px; height: 45px; top: 25%; left: -120px; animation-delay: 5s; }
        .cloud2::before { width: 55px; height: 45px; top: -22px; left: 20px; }
        .cloud2::after { width: 65px; height: 40px; top: -18px; right: 15px; }

        @keyframes float {
            to { transform: translateX(calc(100vw + 200px)); }
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 1;
            max-width: 700px;
            padding: 40px;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 600;
            margin-bottom: 60px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .timer-display {
            font-size: 10rem;
            font-weight: 200;
            margin-bottom: 35px;
            text-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            letter-spacing: -5px;
        }

        .timer-label {
            font-size: 1.4rem;
            margin-bottom: 70px;
            opacity: 0.95;
        }

        .controls {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 60px;
        }

        button {
            background: rgba(255, 255, 255, 0.95);
            border: none;
            color: #4A4E69;
            padding: 20px 55px;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 15px;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        button:hover {
            background: #fff;
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        button#resetBtn {
            background: rgba(255, 255, 255, 0.25);
            color: #fff;
        }

        button#resetBtn:hover {
            background: rgba(255, 255, 255, 0.35);
        }

        .sessions {
            font-size: 1.2rem;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            padding: 20px 50px;
            border-radius: 30px;
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .sessions span {
            font-size: 2.8rem;
            font-weight: 600;
            display: block;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="sun" id="sun"></div>
    <div class="clouds">
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
    </div>

    <div class="container">
        <h1>Daylight Journey</h1>

        <div class="timer-display" id="timer">25:00</div>
        <div class="timer-label" id="label">Watch the sun set as you focus</div>

        <div class="controls">
            <button id="startBtn">Start</button>
            <button id="resetBtn">Reset</button>
        </div>

        <div class="sessions">
            Sunsets completed
            <span id="sessions">0</span>
        </div>
    </div>

    <script>
        let timeLeft = 25 * 60;
        let totalTime = 25 * 60;
        let isRunning = false;
        let isBreak = false;
        let sessionsCompleted = 0;
        let timerInterval;

        const timerDisplay = document.getElementById('timer');
        const labelDisplay = document.getElementById('label');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const sessionsDisplay = document.getElementById('sessions');
        const sun = document.getElementById('sun');
        const body = document.body;

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

            // Move sun as time progresses
            const progress = ((totalTime - timeLeft) / totalTime);
            const sunTop = 10 + (progress * 70); // Move from 10% to 80%
            sun.style.top = sunTop + '%';

            // Change to sunset colors in second half
            if (progress > 0.5) {
                body.classList.add('sunset');
            } else {
                body.classList.remove('sunset');
            }
        }

        function startTimer() {
            if (isRunning) {
                isRunning = false;
                startBtn.textContent = 'Start';
                clearInterval(timerInterval);
            } else {
                isRunning = true;
                startBtn.textContent = 'Pause';
                timerInterval = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateDisplay();
                    } else {
                        clearInterval(timerInterval);
                        isRunning = false;

                        if (!isBreak) {
                            sessionsCompleted++;
                            sessionsDisplay.textContent = sessionsCompleted;
                            isBreak = true;
                            timeLeft = 5 * 60;
                            totalTime = 5 * 60;
                            labelDisplay.textContent = 'Quick break under the stars';
                            startBtn.textContent = 'Start';
                        } else {
                            isBreak = false;
                            timeLeft = 25 * 60;
                            totalTime = 25 * 60;
                            labelDisplay.textContent = 'Watch the sun set as you focus';
                            startBtn.textContent = 'Start';
                        }
                        updateDisplay();
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            isBreak = false;
            timeLeft = 25 * 60;
            totalTime = 25 * 60;
            labelDisplay.textContent = 'Watch the sun set as you focus';
            startBtn.textContent = 'Start';
            updateDisplay();
        }

        startBtn.addEventListener('click', startTimer);
        resetBtn.addEventListener('click', resetTimer);

        updateDisplay();
    </script>
</body>
</html>
