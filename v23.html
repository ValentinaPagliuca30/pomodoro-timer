<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v23: Growing Garden</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Trebuchet MS', sans-serif;
            background: linear-gradient(to bottom, #e3f2fd 0%, #c8e6c9 50%, #a5d6a7 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2e7d32;
        }

        .container {
            text-align: center;
            max-width: 700px;
            padding: 40px;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 600;
            margin-bottom: 50px;
            color: #1b5e20;
        }

        .plant-container {
            width: 200px;
            height: 350px;
            margin: 0 auto 40px;
            position: relative;
        }

        .pot {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 80px;
            background: linear-gradient(to bottom, #d7ccc8 0%, #8d6e63 100%);
            border-radius: 0 0 20px 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .pot::before {
            content: '';
            position: absolute;
            top: -10px;
            left: -5px;
            right: -5px;
            height: 15px;
            background: #a1887f;
            border-radius: 10px 10px 0 0;
        }

        .soil {
            position: absolute;
            top: 5px;
            left: 10px;
            right: 10px;
            height: 30px;
            background: #5d4037;
            border-radius: 50%;
        }

        .plant {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 0;
            background: #558b2f;
            border-radius: 5px 5px 0 0;
            transition: height 1s ease;
        }

        .leaf {
            position: absolute;
            width: 30px;
            height: 40px;
            background: #66bb6a;
            border-radius: 0 100% 0 100%;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .leaf1 { left: -35px; top: 50px; transform: rotate(-45deg); }
        .leaf2 { right: -35px; top: 80px; transform: rotate(45deg); }
        .leaf3 { left: -40px; top: 120px; transform: rotate(-30deg); }
        .leaf4 { right: -40px; top: 150px; transform: rotate(30deg); }

        .flower {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 1s ease;
        }

        .petal {
            position: absolute;
            width: 25px;
            height: 25px;
            background: #ff4081;
            border-radius: 50% 0;
        }

        .petal:nth-child(1) { transform: rotate(0deg) translateY(-15px); }
        .petal:nth-child(2) { transform: rotate(72deg) translateY(-15px); }
        .petal:nth-child(3) { transform: rotate(144deg) translateY(-15px); }
        .petal:nth-child(4) { transform: rotate(216deg) translateY(-15px); }
        .petal:nth-child(5) { transform: rotate(288deg) translateY(-15px); }

        .center {
            position: absolute;
            width: 15px;
            height: 15px;
            background: #ffd54f;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .timer-display {
            font-size: 7.5rem;
            font-weight: 600;
            margin-bottom: 30px;
            color: #2e7d32;
            text-shadow: 0 4px 15px rgba(46, 125, 50, 0.3);
        }

        .timer-label {
            font-size: 1.4rem;
            margin-bottom: 60px;
            color: #388e3c;
        }

        .controls {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 50px;
        }

        button {
            background: #66bb6a;
            border: none;
            color: #fff;
            padding: 20px 55px;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 50px;
            font-weight: 600;
            box-shadow: 0 8px 25px rgba(102, 187, 106, 0.3);
            transition: all 0.3s ease;
        }

        button:hover {
            background: #4caf50;
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(76, 175, 80, 0.4);
        }

        button#resetBtn {
            background: #8d6e63;
        }

        button#resetBtn:hover {
            background: #795548;
        }

        .sessions {
            font-size: 1.2rem;
            background: rgba(255, 255, 255, 0.7);
            padding: 20px 50px;
            border-radius: 40px;
            display: inline-block;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            color: #2e7d32;
        }

        .sessions span {
            font-size: 2.8rem;
            font-weight: 700;
            display: block;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Grow Your Focus</h1>

        <div class="plant-container">
            <div class="plant" id="plant">
                <div class="leaf leaf1" id="leaf1"></div>
                <div class="leaf leaf2" id="leaf2"></div>
                <div class="leaf leaf3" id="leaf3"></div>
                <div class="leaf leaf4" id="leaf4"></div>
                <div class="flower" id="flower">
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="center"></div>
                </div>
            </div>
            <div class="pot">
                <div class="soil"></div>
            </div>
        </div>

        <div class="timer-display" id="timer">25:00</div>
        <div class="timer-label" id="label">Watch your plant grow as you study</div>

        <div class="controls">
            <button id="startBtn">Plant Seed</button>
            <button id="resetBtn">Reset</button>
        </div>

        <div class="sessions">
            Flowers bloomed
            <span id="sessions">0</span>
        </div>
    </div>

    <script>
        let timeLeft = 25 * 60;
        let totalTime = 25 * 60;
        let isRunning = false;
        let isBreak = false;
        let sessionsCompleted = 0;
        let timerInterval;

        const timerDisplay = document.getElementById('timer');
        const labelDisplay = document.getElementById('label');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const sessionsDisplay = document.getElementById('sessions');
        const plant = document.getElementById('plant');
        const leaf1 = document.getElementById('leaf1');
        const leaf2 = document.getElementById('leaf2');
        const leaf3 = document.getElementById('leaf3');
        const leaf4 = document.getElementById('leaf4');
        const flower = document.getElementById('flower');

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

            // Grow plant based on progress
            const progress = ((totalTime - timeLeft) / totalTime);
            const plantHeight = progress * 220; // Max 220px
            plant.style.height = plantHeight + 'px';

            // Show leaves at different stages
            if (progress > 0.2) leaf1.style.opacity = '1';
            if (progress > 0.4) leaf2.style.opacity = '1';
            if (progress > 0.6) leaf3.style.opacity = '1';
            if (progress > 0.8) leaf4.style.opacity = '1';
            if (progress > 0.95) flower.style.opacity = '1';
        }

        function startTimer() {
            if (isRunning) {
                isRunning = false;
                startBtn.textContent = 'Plant Seed';
                clearInterval(timerInterval);
            } else {
                isRunning = true;
                startBtn.textContent = 'Pause';
                timerInterval = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateDisplay();
                    } else {
                        clearInterval(timerInterval);
                        isRunning = false;

                        if (!isBreak) {
                            sessionsCompleted++;
                            sessionsDisplay.textContent = sessionsCompleted;
                            isBreak = true;
                            timeLeft = 5 * 60;
                            totalTime = 5 * 60;
                            labelDisplay.textContent = 'Water your success';
                            startBtn.textContent = 'Plant Seed';
                        } else {
                            isBreak = false;
                            timeLeft = 25 * 60;
                            totalTime = 25 * 60;
                            labelDisplay.textContent = 'Watch your plant grow as you study';
                            startBtn.textContent = 'Plant Seed';
                        }
                        updateDisplay();
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            isBreak = false;
            timeLeft = 25 * 60;
            totalTime = 25 * 60;
            labelDisplay.textContent = 'Watch your plant grow as you study';
            startBtn.textContent = 'Plant Seed';

            // Reset plant
            leaf1.style.opacity = '0';
            leaf2.style.opacity = '0';
            leaf3.style.opacity = '0';
            leaf4.style.opacity = '0';
            flower.style.opacity = '0';

            updateDisplay();
        }

        startBtn.addEventListener('click', startTimer);
        resetBtn.addEventListener('click', resetTimer);

        updateDisplay();
    </script>
</body>
</html>
