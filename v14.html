<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v14: Neumorphism</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #e0e5ec;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4a5568;
        }

        .container {
            text-align: center;
            max-width: 600px;
            padding: 70px 60px;
            background: #e0e5ec;
            border-radius: 50px;
            box-shadow: 20px 20px 60px #bec3c9,
                       -20px -20px 60px #ffffff;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 50px;
            color: #4a5568;
        }

        .timer-display {
            font-size: 7rem;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 30px;
            background: #e0e5ec;
            padding: 40px;
            border-radius: 40px;
            box-shadow: inset 12px 12px 24px #bec3c9,
                        inset -12px -12px 24px #ffffff;
        }

        .timer-label {
            font-size: 1.1rem;
            color: #718096;
            margin-bottom: 50px;
            font-weight: 500;
        }

        .controls {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-bottom: 50px;
        }

        button {
            background: #e0e5ec;
            border: none;
            color: #667eea;
            padding: 20px 50px;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 25px;
            transition: all 0.3s ease;
            font-weight: 600;
            box-shadow: 8px 8px 16px #bec3c9,
                       -8px -8px 16px #ffffff;
        }

        button:hover {
            box-shadow: 12px 12px 24px #bec3c9,
                       -12px -12px 24px #ffffff;
        }

        button:active {
            box-shadow: inset 6px 6px 12px #bec3c9,
                       inset -6px -6px 12px #ffffff;
        }

        .sessions {
            font-size: 1rem;
            color: #718096;
            background: #e0e5ec;
            padding: 20px 40px;
            border-radius: 30px;
            display: inline-block;
            box-shadow: 8px 8px 16px #bec3c9,
                       -8px -8px 16px #ffffff;
        }

        .sessions span {
            font-size: 2.5rem;
            font-weight: 700;
            color: #667eea;
            display: block;
            margin-top: 10px;
        }

        .progress-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #e0e5ec;
            box-shadow: inset 6px 6px 12px #bec3c9,
                       inset -6px -6px 12px #ffffff;
            margin: 0 auto 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #667eea;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Focus Timer</h1>

        <div class="progress-circle">
            <span id="progress">0%</span>
        </div>

        <div class="timer-display" id="timer">25:00</div>
        <div class="timer-label" id="label">Work Session</div>

        <div class="controls">
            <button id="startBtn">Start</button>
            <button id="resetBtn">Reset</button>
        </div>

        <div class="sessions">
            Sessions
            <span id="sessions">0</span>
        </div>
    </div>

    <script>
        let timeLeft = 25 * 60;
        let totalTime = 25 * 60;
        let isRunning = false;
        let isBreak = false;
        let sessionsCompleted = 0;
        let timerInterval;

        const timerDisplay = document.getElementById('timer');
        const labelDisplay = document.getElementById('label');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const sessionsDisplay = document.getElementById('sessions');
        const progressDisplay = document.getElementById('progress');

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

            const progress = Math.round(((totalTime - timeLeft) / totalTime) * 100);
            progressDisplay.textContent = progress + '%';
        }

        function startTimer() {
            if (isRunning) {
                isRunning = false;
                startBtn.textContent = 'Start';
                clearInterval(timerInterval);
            } else {
                isRunning = true;
                startBtn.textContent = 'Pause';
                timerInterval = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateDisplay();
                    } else {
                        clearInterval(timerInterval);
                        isRunning = false;

                        if (!isBreak) {
                            sessionsCompleted++;
                            sessionsDisplay.textContent = sessionsCompleted;
                            isBreak = true;
                            timeLeft = 5 * 60;
                            totalTime = 5 * 60;
                            labelDisplay.textContent = 'Break Time';
                            startBtn.textContent = 'Start';
                        } else {
                            isBreak = false;
                            timeLeft = 25 * 60;
                            totalTime = 25 * 60;
                            labelDisplay.textContent = 'Work Session';
                            startBtn.textContent = 'Start';
                        }
                        updateDisplay();
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            isBreak = false;
            timeLeft = 25 * 60;
            totalTime = 25 * 60;
            labelDisplay.textContent = 'Work Session';
            startBtn.textContent = 'Start';
            updateDisplay();
        }

        startBtn.addEventListener('click', startTimer);
        resetBtn.addEventListener('click', resetTimer);

        updateDisplay();
    </script>
</body>
</html>
