<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v25: FINAL - Perfect Blend</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', sans-serif;
            background: linear-gradient(135deg, #5f72bd 0%, #9b23ea 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, rgba(155, 35, 234, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            top: -180px;
            right: -120px;
            animation: float1 22s ease-in-out infinite;
        }

        @keyframes float1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(35px, 35px) scale(1.05); }
        }

        body::after {
            content: '';
            position: absolute;
            width: 650px;
            height: 650px;
            background: radial-gradient(circle, rgba(95, 114, 189, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            bottom: -220px;
            left: -170px;
            animation: float2 28s ease-in-out infinite;
        }

        @keyframes float2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-35px, -35px) scale(1.05); }
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 800px;
            position: relative;
            z-index: 1;
            animation: fadeIn 0.8s ease;
            padding: 20px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tomato-icon {
            font-size: 4.5rem;
            margin-bottom: 30px;
            animation: gentle-bounce 3.8s ease-in-out infinite;
            filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.3));
            display: inline-block;
        }

        @keyframes gentle-bounce {
            0%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
            50% { transform: translateY(-12px) scale(1.03) rotate(3deg); }
        }

        h1 {
            font-size: 2.6rem;
            font-weight: 600;
            margin-bottom: 60px;
            color: #fff;
            letter-spacing: 0.5px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .timer-display {
            font-size: 12rem;
            font-weight: 200;
            color: #fff;
            margin-bottom: 40px;
            letter-spacing: -8px;
            text-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
            line-height: 1;
        }

        .timer-label {
            font-size: 1.5rem;
            color: rgba(255, 255, 255, 0.95);
            margin-bottom: 75px;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .controls {
            display: flex;
            gap: 24px;
            justify-content: center;
            margin-bottom: 65px;
        }

        button {
            background: rgba(255, 255, 255, 0.98);
            border: none;
            color: #5f72bd;
            padding: 22px 65px;
            font-size: 1.12rem;
            cursor: pointer;
            border-radius: 18px;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-weight: 600;
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.22);
            letter-spacing: 0.4px;
        }

        button:hover {
            background: #fff;
            transform: translateY(-5px) scale(1.04);
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(-2px) scale(0.99);
            transition: all 0.15s ease;
        }

        button#resetBtn {
            background: rgba(255, 255, 255, 0.25);
            color: #fff;
        }

        button#resetBtn:hover {
            background: rgba(255, 255, 255, 0.35);
        }

        .sessions {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.95);
            background: rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(22px);
            padding: 22px 52px;
            border-radius: 34px;
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.32);
            transition: all 0.35s ease;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .sessions:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.18);
        }

        .sessions span {
            font-size: 3rem;
            font-weight: 600;
            color: #fff;
            display: block;
            margin-top: 14px;
        }

        @media (max-width: 768px) {
            .timer-display {
                font-size: 8rem;
                letter-spacing: -5px;
            }

            h1 {
                font-size: 2rem;
            }

            button {
                padding: 18px 50px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="tomato-icon">🍅</div>
        <h1>Pomodoro Flow</h1>

        <div class="timer-display" id="timer">25:00</div>
        <div class="timer-label" id="label">Focus Time</div>

        <div class="controls">
            <button id="startBtn">Start</button>
            <button id="resetBtn">Reset</button>
        </div>

        <div class="sessions">
            Completed
            <span id="sessions">0</span>
        </div>
    </div>

    <script>
        let timeLeft = 25 * 60;
        let totalTime = 25 * 60;
        let isRunning = false;
        let isBreak = false;
        let sessionsCompleted = 0;
        let timerInterval;

        const timerDisplay = document.getElementById('timer');
        const labelDisplay = document.getElementById('label');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const sessionsDisplay = document.getElementById('sessions');

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function startTimer() {
            if (isRunning) {
                isRunning = false;
                startBtn.textContent = 'Start';
                clearInterval(timerInterval);
            } else {
                isRunning = true;
                startBtn.textContent = 'Pause';
                timerInterval = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateDisplay();
                    } else {
                        clearInterval(timerInterval);
                        isRunning = false;

                        if (!isBreak) {
                            sessionsCompleted++;
                            sessionsDisplay.textContent = sessionsCompleted;
                            isBreak = true;
                            timeLeft = 5 * 60;
                            totalTime = 5 * 60;
                            labelDisplay.textContent = 'Break Time';
                            startBtn.textContent = 'Start';
                        } else {
                            isBreak = false;
                            timeLeft = 25 * 60;
                            totalTime = 25 * 60;
                            labelDisplay.textContent = 'Focus Time';
                            startBtn.textContent = 'Start';
                        }
                        updateDisplay();
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            isBreak = false;
            timeLeft = 25 * 60;
            totalTime = 25 * 60;
            labelDisplay.textContent = 'Focus Time';
            startBtn.textContent = 'Start';
            updateDisplay();
        }

        startBtn.addEventListener('click', startTimer);
        resetBtn.addEventListener('click', resetTimer);

        updateDisplay();
    </script>
</body>
</html>
