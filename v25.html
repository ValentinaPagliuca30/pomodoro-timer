<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v25: FINAL - Pomodoro Flow</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', sans-serif;
            background: linear-gradient(135deg, #5f72bd 0%, #9b23ea 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        /* Subtle ambient orbs */
        body::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(155, 35, 234, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            top: -200px;
            right: -150px;
            animation: float1 25s ease-in-out infinite;
        }

        body::after {
            content: '';
            position: absolute;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(95, 114, 189, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            bottom: -250px;
            left: -200px;
            animation: float2 30s ease-in-out infinite;
        }

        @keyframes float1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(40px, 40px) scale(1.1); }
        }

        @keyframes float2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-40px, -40px) scale(1.1); }
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 850px;
            position: relative;
            z-index: 1;
            animation: fadeIn 0.8s ease;
            padding: 20px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(35px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Playful tomato icon */
        .tomato-icon {
            font-size: 5rem;
            margin-bottom: 35px;
            animation: gentle-bounce 4s ease-in-out infinite;
            filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.3));
            display: inline-block;
        }

        @keyframes gentle-bounce {
            0%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
            50% { transform: translateY(-15px) scale(1.05) rotate(5deg); }
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 600;
            margin-bottom: 65px;
            color: #fff;
            letter-spacing: 0.5px;
            text-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        }

        /* Massive central timer */
        .timer-display {
            font-size: 13rem;
            font-weight: 200;
            color: #fff;
            margin-bottom: 40px;
            letter-spacing: -10px;
            text-shadow: 0 15px 45px rgba(0, 0, 0, 0.35);
            line-height: 1;
        }

        .timer-label {
            font-size: 1.6rem;
            color: rgba(255, 255, 255, 0.95);
            margin-bottom: 75px;
            font-weight: 400;
            letter-spacing: 1.2px;
        }

        /* iOS-style buttons */
        .controls {
            display: flex;
            gap: 25px;
            justify-content: center;
            margin-bottom: 70px;
        }

        button {
            background: rgba(255, 255, 255, 0.98);
            border: none;
            color: #5f72bd;
            padding: 22px 70px;
            font-size: 1.15rem;
            cursor: pointer;
            border-radius: 18px;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-weight: 600;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.25);
            letter-spacing: 0.4px;
        }

        button:hover {
            background: #fff;
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 20px 55px rgba(0, 0, 0, 0.35);
        }

        button:active {
            transform: translateY(-2px) scale(0.99);
            transition: all 0.15s ease;
        }

        button#resetBtn {
            background: rgba(255, 255, 255, 0.25);
            color: #fff;
        }

        button#resetBtn:hover {
            background: rgba(255, 255, 255, 0.35);
        }

        /* Glassmorphism session counter */
        .sessions {
            font-size: 1.25rem;
            color: rgba(255, 255, 255, 0.95);
            background: rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(25px);
            padding: 22px 55px;
            border-radius: 35px;
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.35);
            transition: all 0.35s ease;
            letter-spacing: 0.6px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.15);
        }

        .sessions:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 45px rgba(0, 0, 0, 0.22);
        }

        .sessions span {
            font-size: 3.2rem;
            font-weight: 600;
            color: #fff;
            display: block;
            margin-top: 14px;
        }

        /* Progress ring around timer */
        .progress-ring {
            position: absolute;
            width: 280px;
            height: 280px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -120%);
            pointer-events: none;
        }

        .progress-ring svg {
            transform: rotate(-90deg);
        }

        .progress-ring circle {
            fill: none;
            stroke-width: 3;
        }

        .progress-background {
            stroke: rgba(255, 255, 255, 0.15);
        }

        .progress-fill {
            stroke: rgba(255, 255, 255, 0.7);
            stroke-dasharray: 0 880;
            transition: stroke-dasharray 1s ease;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.5));
        }

        /* Responsive */
        @media (max-width: 768px) {
            .timer-display {
                font-size: 8rem;
                letter-spacing: -6px;
            }

            h1 {
                font-size: 2.2rem;
            }

            button {
                padding: 18px 50px;
                font-size: 1rem;
            }

            .tomato-icon {
                font-size: 3.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="tomato-icon">🍅</div>
        <h1>Pomodoro Flow</h1>

        <div class="progress-ring" id="progressRing">
            <svg width="280" height="280" viewBox="0 0 280 280">
                <circle class="progress-background" cx="140" cy="140" r="140"></circle>
                <circle class="progress-fill" cx="140" cy="140" r="140" id="progressCircle"></circle>
            </svg>
        </div>

        <div class="timer-display" id="timer">25:00</div>
        <div class="timer-label" id="label">Focus Time</div>

        <div class="controls">
            <button id="startBtn">Start</button>
            <button id="resetBtn">Reset</button>
        </div>

        <div class="sessions">
            Completed
            <span id="sessions">0</span>
        </div>
    </div>

    <script>
        let timeLeft = 25 * 60;
        let totalTime = 25 * 60;
        let isRunning = false;
        let isBreak = false;
        let sessionsCompleted = 0;
        let timerInterval;

        const timerDisplay = document.getElementById('timer');
        const labelDisplay = document.getElementById('label');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const sessionsDisplay = document.getElementById('sessions');
        const progressCircle = document.getElementById('progressCircle');

        const circumference = 2 * Math.PI * 140;

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

            // Update progress ring
            const progress = ((totalTime - timeLeft) / totalTime);
            const dashArray = (progress * circumference).toFixed(2);
            progressCircle.style.strokeDasharray = `${dashArray} ${circumference}`;
        }

        function startTimer() {
            if (isRunning) {
                isRunning = false;
                startBtn.textContent = 'Start';
                clearInterval(timerInterval);
            } else {
                isRunning = true;
                startBtn.textContent = 'Pause';
                timerInterval = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateDisplay();
                    } else {
                        clearInterval(timerInterval);
                        isRunning = false;

                        if (!isBreak) {
                            sessionsCompleted++;
                            sessionsDisplay.textContent = sessionsCompleted;
                            isBreak = true;
                            timeLeft = 5 * 60;
                            totalTime = 5 * 60;
                            labelDisplay.textContent = 'Break Time';
                            startBtn.textContent = 'Start';
                        } else {
                            isBreak = false;
                            timeLeft = 25 * 60;
                            totalTime = 25 * 60;
                            labelDisplay.textContent = 'Focus Time';
                            startBtn.textContent = 'Start';
                        }
                        updateDisplay();
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            isBreak = false;
            timeLeft = 25 * 60;
            totalTime = 25 * 60;
            labelDisplay.textContent = 'Focus Time';
            startBtn.textContent = 'Start';
            updateDisplay();
        }

        startBtn.addEventListener('click', startTimer);
        resetBtn.addEventListener('click', resetTimer);

        updateDisplay();
    </script>
</body>
</html>
