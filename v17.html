<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v17: Starry Night</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: linear-gradient(to bottom, #0c0e1a 0%, #1a1d3a 50%, #2d1b4e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .moon {
            position: absolute;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle at 30% 30%, #f4f4f4, #d4d4d4);
            border-radius: 50%;
            top: 15%;
            right: 15%;
            box-shadow: 0 0 60px rgba(255, 255, 255, 0.4),
                        inset -10px -10px 20px rgba(0, 0, 0, 0.2);
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 1;
            max-width: 700px;
            padding: 40px;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 300;
            margin-bottom: 60px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .timer-display {
            font-size: 10rem;
            font-weight: 100;
            margin-bottom: 35px;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
            letter-spacing: -5px;
        }

        .timer-label {
            font-size: 1.4rem;
            margin-bottom: 70px;
            opacity: 0.9;
            letter-spacing: 2px;
        }

        .controls {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 60px;
        }

        button {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 20px 55px;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 15px;
            font-weight: 600;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.1);
        }

        button#resetBtn {
            background: rgba(255, 255, 255, 0.08);
        }

        .sessions {
            font-size: 1.2rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 20px 50px;
            border-radius: 30px;
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .sessions span {
            font-size: 2.8rem;
            font-weight: 300;
            display: block;
            margin-top: 10px;
        }

        .constellation {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .constellation-line {
            position: absolute;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
            transform-origin: left center;
        }
    </style>
</head>
<body>
    <div class="stars" id="starsContainer"></div>
    <div class="moon"></div>
    <div class="constellation" id="constellation"></div>

    <div class="container">
        <h1>Starry Night Focus</h1>

        <div class="timer-display" id="timer">25:00</div>
        <div class="timer-label" id="label">Study under the stars</div>

        <div class="controls">
            <button id="startBtn">Start</button>
            <button id="resetBtn">Reset</button>
        </div>

        <div class="sessions">
            Nights completed
            <span id="sessions">0</span>
        </div>
    </div>

    <script>
        // Generate random stars
        const starsContainer = document.getElementById('starsContainer');
        for (let i = 0; i < 150; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 3 + 's';
            star.style.animationDuration = (Math.random() * 3 + 2) + 's';
            starsContainer.appendChild(star);
        }

        let timeLeft = 25 * 60;
        let totalTime = 25 * 60;
        let isRunning = false;
        let isBreak = false;
        let sessionsCompleted = 0;
        let timerInterval;

        const timerDisplay = document.getElementById('timer');
        const labelDisplay = document.getElementById('label');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const sessionsDisplay = document.getElementById('sessions');

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function startTimer() {
            if (isRunning) {
                isRunning = false;
                startBtn.textContent = 'Start';
                clearInterval(timerInterval);
            } else {
                isRunning = true;
                startBtn.textContent = 'Pause';
                timerInterval = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateDisplay();
                    } else {
                        clearInterval(timerInterval);
                        isRunning = false;

                        if (!isBreak) {
                            sessionsCompleted++;
                            sessionsDisplay.textContent = sessionsCompleted;
                            isBreak = true;
                            timeLeft = 5 * 60;
                            totalTime = 5 * 60;
                            labelDisplay.textContent = 'Moonlit break';
                            startBtn.textContent = 'Start';
                        } else {
                            isBreak = false;
                            timeLeft = 25 * 60;
                            totalTime = 25 * 60;
                            labelDisplay.textContent = 'Study under the stars';
                            startBtn.textContent = 'Start';
                        }
                        updateDisplay();
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            isBreak = false;
            timeLeft = 25 * 60;
            totalTime = 25 * 60;
            labelDisplay.textContent = 'Study under the stars';
            startBtn.textContent = 'Start';
            updateDisplay();
        }

        startBtn.addEventListener('click', startTimer);
        resetBtn.addEventListener('click', resetTimer);

        updateDisplay();
    </script>
</body>
</html>
