<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v24: Polish Details</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: linear-gradient(135deg, #5f72bd 0%, #9b23ea 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(155, 35, 234, 0.12) 0%, transparent 70%);
            border-radius: 50%;
            top: -150px;
            right: -100px;
            animation: float1 20s ease-in-out infinite;
        }

        @keyframes float1 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, 30px); }
        }

        body::after {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(95, 114, 189, 0.12) 0%, transparent 70%);
            border-radius: 50%;
            bottom: -200px;
            left: -150px;
            animation: float2 25s ease-in-out infinite;
        }

        @keyframes float2 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-30px, -30px); }
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 750px;
            position: relative;
            z-index: 1;
            animation: fadeIn 0.7s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tomato-icon {
            font-size: 4.2rem;
            margin-bottom: 28px;
            animation: gentle-bounce 3.5s ease-in-out infinite;
            filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.28));
        }

        @keyframes gentle-bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.02); }
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 58px;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .timer-display {
            font-size: 11.5rem;
            font-weight: 200;
            color: #fff;
            margin-bottom: 38px;
            letter-spacing: -7px;
            text-shadow: 0 10px 35px rgba(0, 0, 0, 0.28);
        }

        .timer-label {
            font-size: 1.45rem;
            color: rgba(255, 255, 255, 0.93);
            margin-bottom: 72px;
            font-weight: 400;
            letter-spacing: 0.8px;
        }

        .controls {
            display: flex;
            gap: 22px;
            justify-content: center;
            margin-bottom: 62px;
        }

        button {
            background: rgba(255, 255, 255, 0.97);
            border: none;
            color: #5f72bd;
            padding: 21px 60px;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 17px;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-weight: 600;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.2);
            letter-spacing: 0.3px;
        }

        button:hover {
            background: #fff;
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 16px 45px rgba(0, 0, 0, 0.28);
        }

        button:active {
            transform: translateY(-2px) scale(0.99);
            transition: all 0.12s ease;
        }

        button#resetBtn {
            background: rgba(255, 255, 255, 0.24);
            color: #fff;
        }

        button#resetBtn:hover {
            background: rgba(255, 255, 255, 0.34);
        }

        .sessions {
            font-size: 1.18rem;
            color: rgba(255, 255, 255, 0.94);
            background: rgba(255, 255, 255, 0.21);
            backdrop-filter: blur(20px);
            padding: 20px 48px;
            border-radius: 32px;
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.35s ease;
            letter-spacing: 0.5px;
        }

        .sessions:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .sessions span {
            font-size: 2.9rem;
            font-weight: 600;
            color: #fff;
            display: block;
            margin-top: 12px;
        }

        @media (max-width: 768px) {
            .timer-display {
                font-size: 8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="tomato-icon">🍅</div>
        <h1>Pomodoro Flow</h1>

        <div class="timer-display" id="timer">25:00</div>
        <div class="timer-label" id="label">Focus Time</div>

        <div class="controls">
            <button id="startBtn">Start</button>
            <button id="resetBtn">Reset</button>
        </div>

        <div class="sessions">
            Completed
            <span id="sessions">0</span>
        </div>
    </div>

    <script>
        let timeLeft = 25 * 60;
        let totalTime = 25 * 60;
        let isRunning = false;
        let isBreak = false;
        let sessionsCompleted = 0;
        let timerInterval;

        const timerDisplay = document.getElementById('timer');
        const labelDisplay = document.getElementById('label');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const sessionsDisplay = document.getElementById('sessions');

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function startTimer() {
            if (isRunning) {
                isRunning = false;
                startBtn.textContent = 'Start';
                clearInterval(timerInterval);
            } else {
                isRunning = true;
                startBtn.textContent = 'Pause';
                timerInterval = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateDisplay();
                    } else {
                        clearInterval(timerInterval);
                        isRunning = false;

                        if (!isBreak) {
                            sessionsCompleted++;
                            sessionsDisplay.textContent = sessionsCompleted;
                            isBreak = true;
                            timeLeft = 5 * 60;
                            totalTime = 5 * 60;
                            labelDisplay.textContent = 'Break Time';
                            startBtn.textContent = 'Start';
                        } else {
                            isBreak = false;
                            timeLeft = 25 * 60;
                            totalTime = 25 * 60;
                            labelDisplay.textContent = 'Focus Time';
                            startBtn.textContent = 'Start';
                        }
                        updateDisplay();
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            isBreak = false;
            timeLeft = 25 * 60;
            totalTime = 25 * 60;
            labelDisplay.textContent = 'Focus Time';
            startBtn.textContent = 'Start';
            updateDisplay();
        }

        startBtn.addEventListener('click', startTimer);
        resetBtn.addEventListener('click', resetTimer);

        updateDisplay();
    </script>
</body>
</html>
