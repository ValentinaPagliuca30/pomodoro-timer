<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v24: Ocean Wave</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Gill Sans', 'Avenir', sans-serif;
            background: linear-gradient(to bottom, #1e3c72 0%, #2a5298 50%, #7474bf 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            overflow: hidden;
            position: relative;
        }

        .wave-background {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 0%;
            background: linear-gradient(to top, #4facfe 0%, #00f2fe 100%);
            transition: height 1s ease;
        }

        .wave {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 200%;
            height: 150px;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M321.39,56.44c58-10.79,114.16-30.13,172-41.86,82.39-16.72,168.19-17.73,250.45-.39C823.78,31,906.67,72,985.66,92.83c70.05,18.48,146.53,26.09,214.34,3V0H0V27.35A600.21,600.21,0,0,0,321.39,56.44Z" fill="rgba(255,255,255,0.1)"/></svg>') repeat-x;
            animation: wave 10s linear infinite;
        }

        .wave2 {
            bottom: 10px;
            opacity: 0.5;
            animation: wave 15s linear infinite reverse;
        }

        @keyframes wave {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .container {
            text-align: center;
            max-width: 700px;
            padding: 40px;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 3rem;
            font-weight: 300;
            margin-bottom: 50px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
            letter-spacing: 2px;
        }

        .glass-container {
            width: 200px;
            height: 350px;
            margin: 0 auto 40px;
            border: 5px solid rgba(255, 255, 255, 0.5);
            border-radius: 15px;
            position: relative;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(5px);
            overflow: hidden;
        }

        .water {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 0%;
            background: linear-gradient(to top, #4facfe 0%, rgba(79, 172, 254, 0.8) 100%);
            transition: height 1s ease;
        }

        .water-surface {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 20px;
            background: rgba(255, 255, 255, 0.3);
            filter: blur(8px);
        }

        .timer-display {
            font-size: 8rem;
            font-weight: 200;
            margin-bottom: 30px;
            text-shadow: 0 6px 25px rgba(0,0,0,0.4);
            letter-spacing: -4px;
        }

        .timer-label {
            font-size: 1.5rem;
            margin-bottom: 60px;
            opacity: 0.9;
            letter-spacing: 1px;
        }

        .controls {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 50px;
        }

        button {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: #fff;
            padding: 20px 55px;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        button#resetBtn {
            background: rgba(255, 255, 255, 0.1);
        }

        .sessions {
            font-size: 1.2rem;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            padding: 20px 50px;
            border-radius: 35px;
            display: inline-block;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .sessions span {
            font-size: 2.8rem;
            font-weight: 600;
            display: block;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="wave-background" id="waveBackground">
        <div class="wave"></div>
        <div class="wave wave2"></div>
    </div>

    <div class="container">
        <h1>Ocean of Focus</h1>

        <div class="glass-container">
            <div class="water" id="water">
                <div class="water-surface"></div>
            </div>
        </div>

        <div class="timer-display" id="timer">25:00</div>
        <div class="timer-label" id="label">Fill the ocean with your dedication</div>

        <div class="controls">
            <button id="startBtn">Flow</button>
            <button id="resetBtn">Reset</button>
        </div>

        <div class="sessions">
            Oceans filled
            <span id="sessions">0</span>
        </div>
    </div>

    <script>
        let timeLeft = 25 * 60;
        let totalTime = 25 * 60;
        let isRunning = false;
        let isBreak = false;
        let sessionsCompleted = 0;
        let timerInterval;

        const timerDisplay = document.getElementById('timer');
        const labelDisplay = document.getElementById('label');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const sessionsDisplay = document.getElementById('sessions');
        const water = document.getElementById('water');
        const waveBackground = document.getElementById('waveBackground');

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

            // Fill water
            const progress = ((totalTime - timeLeft) / totalTime);
            water.style.height = (progress * 100) + '%';
            waveBackground.style.height = (progress * 30) + '%';
        }

        function startTimer() {
            if (isRunning) {
                isRunning = false;
                startBtn.textContent = 'Flow';
                clearInterval(timerInterval);
            } else {
                isRunning = true;
                startBtn.textContent = 'Pause';
                timerInterval = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateDisplay();
                    } else {
                        clearInterval(timerInterval);
                        isRunning = false;

                        if (!isBreak) {
                            sessionsCompleted++;
                            sessionsDisplay.textContent = sessionsCompleted;
                            isBreak = true;
                            timeLeft = 5 * 60;
                            totalTime = 5 * 60;
                            labelDisplay.textContent = 'Ride the wave of rest';
                            startBtn.textContent = 'Flow';
                        } else {
                            isBreak = false;
                            timeLeft = 25 * 60;
                            totalTime = 25 * 60;
                            labelDisplay.textContent = 'Fill the ocean with your dedication';
                            startBtn.textContent = 'Flow';
                        }
                        updateDisplay();
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            isBreak = false;
            timeLeft = 25 * 60;
            totalTime = 25 * 60;
            labelDisplay.textContent = 'Fill the ocean with your dedication';
            startBtn.textContent = 'Flow';
            updateDisplay();
        }

        startBtn.addEventListener('click', startTimer);
        resetBtn.addEventListener('click', resetTimer);

        updateDisplay();
    </script>
</body>
</html>
