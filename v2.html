<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v2: FINAL - Lunar Cycle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: linear-gradient(to bottom, #0a0e27 0%, #1a1d3a 50%, #2d1b4e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        /* Stars twinkling */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .container {
            text-align: center;
            max-width: 700px;
            padding: 40px;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 300;
            margin-bottom: 50px;
            color: #e0e0e0;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        /* Moon container */
        .moon-container {
            width: 300px;
            height: 300px;
            margin: 0 auto 40px;
            position: relative;
        }

        /* Full moon background */
        .moon {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #f0f0f0, #d0d0d0);
            position: relative;
            box-shadow: 0 0 80px rgba(240, 240, 240, 0.6),
                        inset -15px -15px 30px rgba(0, 0, 0, 0.2);
        }

        /* Craters */
        .crater {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #b8b8b8, #a0a0a0);
            box-shadow: inset 3px 3px 8px rgba(0, 0, 0, 0.5);
        }

        .crater1 { width: 40px; height: 40px; top: 20%; left: 30%; }
        .crater2 { width: 30px; height: 30px; top: 50%; right: 25%; }
        .crater3 { width: 25px; height: 25px; bottom: 30%; left: 40%; }
        .crater4 { width: 20px; height: 20px; top: 40%; left: 60%; }

        /* Shadow that moves to reveal moon (waxing) */
        .moon-shadow {
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background: #0a0e27;
            border-radius: 50%;
            transition: transform 1s ease;
            transform-origin: center;
        }

        .timer-display {
            font-size: 8rem;
            font-weight: 200;
            margin-bottom: 30px;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.4);
            letter-spacing: -4px;
        }

        .timer-label {
            font-size: 1.4rem;
            margin-bottom: 60px;
            opacity: 0.9;
            letter-spacing: 2px;
        }

        .controls {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 50px;
        }

        button {
            background: rgba(240, 240, 240, 0.15);
            border: 2px solid rgba(240, 240, 240, 0.4);
            color: #fff;
            padding: 20px 55px;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 50px;
            font-weight: 600;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        button:hover {
            background: rgba(240, 240, 240, 0.25);
            border-color: rgba(240, 240, 240, 0.6);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.15);
        }

        .sessions {
            font-size: 1.2rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 20px 50px;
            border-radius: 30px;
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .sessions span {
            font-size: 2.8rem;
            font-weight: 600;
            display: block;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="stars" id="starsContainer"></div>

    <div class="container">
        <h1>Lunar Focus</h1>

        <div class="moon-container">
            <div class="moon">
                <div class="crater crater1"></div>
                <div class="crater crater2"></div>
                <div class="crater crater3"></div>
                <div class="crater crater4"></div>
                <div class="moon-shadow" id="moonShadow"></div>
            </div>
        </div>

        <div class="timer-display" id="timer">25:00</div>
        <div class="timer-label" id="label">Watch the moon wax to full</div>

        <div class="controls">
            <button id="startBtn">Begin</button>
            <button id="resetBtn">Reset</button>
        </div>

        <div class="sessions">
            Lunar cycles
            <span id="sessions">0</span>
        </div>
    </div>

    <script>
        // Generate stars
        const starsContainer = document.getElementById('starsContainer');
        for (let i = 0; i < 120; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 3 + 's';
            star.style.animationDuration = (Math.random() * 2 + 2) + 's';
            starsContainer.appendChild(star);
        }

        let timeLeft = 25 * 60;
        let totalTime = 25 * 60;
        let isRunning = false;
        let isBreak = false;
        let sessionsCompleted = 0;
        let timerInterval;

        const timerDisplay = document.getElementById('timer');
        const labelDisplay = document.getElementById('label');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const sessionsDisplay = document.getElementById('sessions');
        const moonShadow = document.getElementById('moonShadow');

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

            // Move shadow to reveal moon (waxing)
            const progress = ((totalTime - timeLeft) / totalTime);
            // Shadow moves from right to left, revealing the moon
            const translateX = progress * 100;
            moonShadow.style.transform = `translateX(${translateX}%)`;
        }

        function startTimer() {
            if (isRunning) {
                isRunning = false;
                startBtn.textContent = 'Begin';
                clearInterval(timerInterval);
            } else {
                isRunning = true;
                startBtn.textContent = 'Pause';
                timerInterval = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateDisplay();
                    } else {
                        clearInterval(timerInterval);
                        isRunning = false;

                        if (!isBreak) {
                            sessionsCompleted++;
                            sessionsDisplay.textContent = sessionsCompleted;
                            isBreak = true;
                            timeLeft = 5 * 60;
                            totalTime = 5 * 60;
                            labelDisplay.textContent = 'Moonlight break';
                            startBtn.textContent = 'Begin';
                        } else {
                            isBreak = false;
                            timeLeft = 25 * 60;
                            totalTime = 25 * 60;
                            labelDisplay.textContent = 'Watch the moon wax to full';
                            startBtn.textContent = 'Begin';
                        }
                        updateDisplay();
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            isBreak = false;
            timeLeft = 25 * 60;
            totalTime = 25 * 60;
            labelDisplay.textContent = 'Watch the moon wax to full';
            startBtn.textContent = 'Begin';
            updateDisplay();
        }

        startBtn.addEventListener('click', startTimer);
        resetBtn.addEventListener('click', resetTimer);

        updateDisplay();
    </script>
</body>
</html>
