<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v2: Brutalist Bold</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            border: 8px solid #fff;
            padding: 40px;
            max-width: 600px;
        }

        h1 {
            font-size: 4rem;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 20px;
            line-height: 0.9;
        }

        .timer-display {
            font-size: 8rem;
            font-weight: 900;
            border: 8px solid #fff;
            padding: 30px;
            margin: 30px 0;
            text-align: center;
            font-family: 'Courier New', monospace;
        }

        .timer-label {
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            border: 4px solid #fff;
            padding: 15px;
            text-align: center;
            margin-bottom: 30px;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        button {
            background: #fff;
            border: none;
            color: #000;
            padding: 25px;
            font-size: 1.2rem;
            text-transform: uppercase;
            font-weight: 900;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            transition: all 0.1s ease;
        }

        button:hover {
            background: #000;
            color: #fff;
            outline: 4px solid #fff;
        }

        button:active {
            transform: scale(0.95);
        }

        .sessions {
            font-size: 1.2rem;
            font-weight: 900;
            text-transform: uppercase;
            border: 4px solid #fff;
            padding: 15px;
            text-align: center;
        }

        .sessions span {
            font-size: 2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>WORK<br>NOW</h1>

        <div class="timer-display" id="timer">25:00</div>
        <div class="timer-label" id="label">WORK SESSION</div>

        <div class="controls">
            <button id="startBtn">START</button>
            <button id="resetBtn">RESET</button>
        </div>

        <div class="sessions">
            SESSIONS: <span id="sessions">0</span>
        </div>
    </div>

    <script>
        let timeLeft = 25 * 60;
        let totalTime = 25 * 60;
        let isRunning = false;
        let isBreak = false;
        let sessionsCompleted = 0;
        let timerInterval;

        const timerDisplay = document.getElementById('timer');
        const labelDisplay = document.getElementById('label');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const sessionsDisplay = document.getElementById('sessions');

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function startTimer() {
            if (isRunning) {
                isRunning = false;
                startBtn.textContent = 'START';
                clearInterval(timerInterval);
            } else {
                isRunning = true;
                startBtn.textContent = 'PAUSE';
                timerInterval = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateDisplay();
                    } else {
                        clearInterval(timerInterval);
                        isRunning = false;

                        if (!isBreak) {
                            sessionsCompleted++;
                            sessionsDisplay.textContent = sessionsCompleted;
                            isBreak = true;
                            timeLeft = 5 * 60;
                            totalTime = 5 * 60;
                            labelDisplay.textContent = 'BREAK TIME';
                            startBtn.textContent = 'START';
                        } else {
                            isBreak = false;
                            timeLeft = 25 * 60;
                            totalTime = 25 * 60;
                            labelDisplay.textContent = 'WORK SESSION';
                            startBtn.textContent = 'START';
                        }
                        updateDisplay();
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            isBreak = false;
            timeLeft = 25 * 60;
            totalTime = 25 * 60;
            labelDisplay.textContent = 'WORK SESSION';
            startBtn.textContent = 'START';
            updateDisplay();
        }

        startBtn.addEventListener('click', startTimer);
        resetBtn.addEventListener('click', resetTimer);

        updateDisplay();
    </script>
</body>
</html>
