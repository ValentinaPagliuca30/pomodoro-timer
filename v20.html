<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v20: Pie Chart Progress</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .container {
            text-align: center;
            max-width: 700px;
            padding: 40px;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 700;
            margin-bottom: 50px;
            letter-spacing: -1px;
        }

        .chart-container {
            width: 320px;
            height: 320px;
            margin: 0 auto 40px;
            position: relative;
        }

        .pie-chart {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .pie-chart circle {
            fill: none;
            stroke-width: 60;
        }

        .pie-background {
            stroke: rgba(255, 255, 255, 0.2);
        }

        .pie-fill {
            stroke: #fff;
            stroke-dasharray: 0 628;
            transition: stroke-dasharray 1s ease;
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.5));
        }

        .chart-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3.5rem;
            font-weight: 300;
        }

        .timer-display {
            font-size: 7.5rem;
            font-weight: 300;
            margin-bottom: 25px;
            text-shadow: 0 5px 20px rgba(0,0,0,0.2);
            letter-spacing: -3px;
        }

        .timer-label {
            font-size: 1.4rem;
            margin-bottom: 60px;
            opacity: 0.95;
            letter-spacing: 1px;
        }

        .controls {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 50px;
        }

        button {
            background: rgba(255, 255, 255, 0.95);
            border: none;
            color: #667eea;
            padding: 20px 55px;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 12px;
            font-weight: 600;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            transition: all 0.3s ease;
        }

        button:hover {
            background: #fff;
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(0,0,0,0.25);
        }

        button#resetBtn {
            background: rgba(255, 255, 255, 0.25);
            color: #fff;
        }

        button#resetBtn:hover {
            background: rgba(255, 255, 255, 0.35);
        }

        .sessions {
            font-size: 1.2rem;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            padding: 20px 50px;
            border-radius: 30px;
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .sessions span {
            font-size: 2.8rem;
            font-weight: 600;
            display: block;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Visual Progress</h1>

        <div class="chart-container">
            <svg class="pie-chart" viewBox="0 0 200 200">
                <circle class="pie-background" cx="100" cy="100" r="90"></circle>
                <circle class="pie-fill" cx="100" cy="100" r="90" id="pieFill"></circle>
            </svg>
            <div class="chart-center" id="percentage">0%</div>
        </div>

        <div class="timer-display" id="timer">25:00</div>
        <div class="timer-label" id="label">Fill the circle as you focus</div>

        <div class="controls">
            <button id="startBtn">Start</button>
            <button id="resetBtn">Reset</button>
        </div>

        <div class="sessions">
            Circles completed
            <span id="sessions">0</span>
        </div>
    </div>

    <script>
        let timeLeft = 25 * 60;
        let totalTime = 25 * 60;
        let isRunning = false;
        let isBreak = false;
        let sessionsCompleted = 0;
        let timerInterval;

        const timerDisplay = document.getElementById('timer');
        const labelDisplay = document.getElementById('label');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const sessionsDisplay = document.getElementById('sessions');
        const pieFill = document.getElementById('pieFill');
        const percentage = document.getElementById('percentage');

        const circumference = 2 * Math.PI * 90; // 2πr

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

            // Update pie chart
            const progress = ((totalTime - timeLeft) / totalTime);
            const dashArray = (progress * circumference).toFixed(2);
            pieFill.style.strokeDasharray = `${dashArray} ${circumference}`;

            // Update percentage
            const percent = Math.round(progress * 100);
            percentage.textContent = percent + '%';
        }

        function startTimer() {
            if (isRunning) {
                isRunning = false;
                startBtn.textContent = 'Start';
                clearInterval(timerInterval);
            } else {
                isRunning = true;
                startBtn.textContent = 'Pause';
                timerInterval = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateDisplay();
                    } else {
                        clearInterval(timerInterval);
                        isRunning = false;

                        if (!isBreak) {
                            sessionsCompleted++;
                            sessionsDisplay.textContent = sessionsCompleted;
                            isBreak = true;
                            timeLeft = 5 * 60;
                            totalTime = 5 * 60;
                            labelDisplay.textContent = 'Break time progress';
                            startBtn.textContent = 'Start';
                        } else {
                            isBreak = false;
                            timeLeft = 25 * 60;
                            totalTime = 25 * 60;
                            labelDisplay.textContent = 'Fill the circle as you focus';
                            startBtn.textContent = 'Start';
                        }
                        updateDisplay();
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            isBreak = false;
            timeLeft = 25 * 60;
            totalTime = 25 * 60;
            labelDisplay.textContent = 'Fill the circle as you focus';
            startBtn.textContent = 'Start';
            updateDisplay();
        }

        startBtn.addEventListener('click', startTimer);
        resetBtn.addEventListener('click', resetTimer);

        updateDisplay();
    </script>
</body>
</html>
