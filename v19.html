<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v19: Candle Burn</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(to bottom, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f5f5f5;
        }

        .container {
            text-align: center;
            max-width: 700px;
            padding: 40px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 300;
            margin-bottom: 50px;
            color: #ffa500;
            font-style: italic;
            text-shadow: 0 0 20px rgba(255, 165, 0, 0.5);
        }

        .candle-container {
            width: 120px;
            height: 350px;
            margin: 0 auto 40px;
            position: relative;
        }

        .flame {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 60px;
            background: radial-gradient(ellipse at center bottom, #fff 0%, #ffd700 20%, #ff8c00 50%, #ff4500 100%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: flicker 0.3s infinite alternate;
            box-shadow: 0 0 40px rgba(255, 140, 0, 0.8);
        }

        @keyframes flicker {
            0% { transform: translateX(-50%) scale(1, 1); }
            100% { transform: translateX(-50%) scale(1.05, 0.95); }
        }

        .wick {
            position: absolute;
            top: 45px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 20px;
            background: #333;
        }

        .candle-body {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 280px;
            background: linear-gradient(to bottom, #f4e4c1 0%, #d4c4a1 100%);
            border-radius: 10px 10px 5px 5px;
            box-shadow: 0 5px 30px rgba(0,0,0,0.5);
        }

        .wax-drip {
            position: absolute;
            width: 100%;
            height: 0;
            top: 0;
            background: linear-gradient(to bottom, transparent 0%, #f4e4c1 100%);
            transition: height 1s linear;
        }

        .timer-display {
            font-size: 7rem;
            font-weight: 300;
            margin-bottom: 25px;
            color: #ffa500;
            text-shadow: 0 0 30px rgba(255, 165, 0, 0.6);
        }

        .timer-label {
            font-size: 1.3rem;
            margin-bottom: 60px;
            color: #d4af37;
            font-style: italic;
        }

        .controls {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 50px;
        }

        button {
            background: rgba(255, 165, 0, 0.2);
            border: 2px solid #ffa500;
            color: #ffa500;
            padding: 18px 50px;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 10px;
            font-weight: 600;
            font-family: Georgia, serif;
            transition: all 0.3s ease;
        }

        button:hover {
            background: rgba(255, 165, 0, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 165, 0, 0.3);
        }

        button#resetBtn {
            border-color: #d4af37;
            color: #d4af37;
            background: rgba(212, 175, 55, 0.1);
        }

        button#resetBtn:hover {
            background: rgba(212, 175, 55, 0.2);
        }

        .sessions {
            font-size: 1.2rem;
            background: rgba(255, 165, 0, 0.1);
            padding: 18px 45px;
            border-radius: 25px;
            display: inline-block;
            border: 1px solid rgba(255, 165, 0, 0.3);
            color: #ffa500;
        }

        .sessions span {
            font-size: 2.5rem;
            font-weight: 600;
            display: block;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Candlelight Focus</h1>

        <div class="candle-container">
            <div class="flame"></div>
            <div class="wick"></div>
            <div class="candle-body" id="candleBody">
                <div class="wax-drip" id="waxDrip"></div>
            </div>
        </div>

        <div class="timer-display" id="timer">25:00</div>
        <div class="timer-label" id="label">Watch the candle burn as you study</div>

        <div class="controls">
            <button id="startBtn">Light It</button>
            <button id="resetBtn">Reset</button>
        </div>

        <div class="sessions">
            Candles burned
            <span id="sessions">0</span>
        </div>
    </div>

    <script>
        let timeLeft = 25 * 60;
        let totalTime = 25 * 60;
        let isRunning = false;
        let isBreak = false;
        let sessionsCompleted = 0;
        let timerInterval;

        const timerDisplay = document.getElementById('timer');
        const labelDisplay = document.getElementById('label');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const sessionsDisplay = document.getElementById('sessions');
        const candleBody = document.getElementById('candleBody');
        const waxDrip = document.getElementById('waxDrip');

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

            // Burn down the candle
            const progress = ((totalTime - timeLeft) / totalTime);
            const candleHeight = 280 - (progress * 200); // Burn from 280px to 80px
            candleBody.style.height = candleHeight + 'px';
            waxDrip.style.height = (progress * 30) + 'px';
        }

        function startTimer() {
            if (isRunning) {
                isRunning = false;
                startBtn.textContent = 'Light It';
                clearInterval(timerInterval);
            } else {
                isRunning = true;
                startBtn.textContent = 'Pause';
                timerInterval = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateDisplay();
                    } else {
                        clearInterval(timerInterval);
                        isRunning = false;

                        if (!isBreak) {
                            sessionsCompleted++;
                            sessionsDisplay.textContent = sessionsCompleted;
                            isBreak = true;
                            timeLeft = 5 * 60;
                            totalTime = 5 * 60;
                            labelDisplay.textContent = 'Rest in the glow';
                            startBtn.textContent = 'Light It';
                        } else {
                            isBreak = false;
                            timeLeft = 25 * 60;
                            totalTime = 25 * 60;
                            labelDisplay.textContent = 'Watch the candle burn as you study';
                            startBtn.textContent = 'Light It';
                        }
                        updateDisplay();
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            isBreak = false;
            timeLeft = 25 * 60;
            totalTime = 25 * 60;
            labelDisplay.textContent = 'Watch the candle burn as you study';
            startBtn.textContent = 'Light It';
            updateDisplay();
        }

        startBtn.addEventListener('click', startTimer);
        resetBtn.addEventListener('click', resetTimer);

        updateDisplay();
    </script>
</body>
</html>
