<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v9: Neon Cyberpunk</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Orbitron', 'Arial Black', sans-serif;
            background: #0d0221;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 0, 255, 0.3) 0%, transparent 70%);
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.8; }
        }

        .container {
            text-align: center;
            max-width: 700px;
            padding: 60px;
            border: 3px solid #ff00ff;
            box-shadow: 0 0 30px #ff00ff,
                        0 0 60px #00ffff,
                        inset 0 0 30px rgba(255, 0, 255, 0.1);
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 40px;
            color: #00ffff;
            text-shadow: 0 0 20px #00ffff,
                         0 0 40px #ff00ff;
            letter-spacing: 5px;
        }

        .timer-display {
            font-size: 8rem;
            font-weight: 900;
            background: linear-gradient(45deg, #ff00ff, #00ffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 25px;
            filter: drop-shadow(0 0 30px #ff00ff);
        }

        .timer-label {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 50px;
            color: #ff00ff;
            text-shadow: 0 0 15px #ff00ff;
        }

        .controls {
            display: flex;
            gap: 25px;
            justify-content: center;
            margin-bottom: 50px;
        }

        button {
            background: transparent;
            border: 2px solid #00ffff;
            color: #00ffff;
            padding: 20px 50px;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 900;
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(0, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.5s, height 0.5s;
        }

        button:hover::before {
            width: 300px;
            height: 300px;
        }

        button:hover {
            box-shadow: 0 0 30px #00ffff,
                        inset 0 0 20px rgba(0, 255, 255, 0.3);
            text-shadow: 0 0 15px #00ffff;
        }

        button:active {
            transform: scale(0.95);
        }

        .sessions {
            font-size: 1rem;
            color: #ff00ff;
            text-transform: uppercase;
            letter-spacing: 3px;
            border: 2px solid #ff00ff;
            padding: 15px 35px;
            display: inline-block;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
        }

        .sessions span {
            color: #00ffff;
            font-weight: 900;
            font-size: 1.8rem;
            text-shadow: 0 0 20px #00ffff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CYBER FOCUS</h1>

        <div class="timer-display" id="timer">25:00</div>
        <div class="timer-label" id="label">WORK MODE</div>

        <div class="controls">
            <button id="startBtn">ACTIVATE</button>
            <button id="resetBtn">REBOOT</button>
        </div>

        <div class="sessions">
            LEVEL: <span id="sessions">0</span>
        </div>
    </div>

    <script>
        let timeLeft = 25 * 60;
        let totalTime = 25 * 60;
        let isRunning = false;
        let isBreak = false;
        let sessionsCompleted = 0;
        let timerInterval;

        const timerDisplay = document.getElementById('timer');
        const labelDisplay = document.getElementById('label');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const sessionsDisplay = document.getElementById('sessions');

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function startTimer() {
            if (isRunning) {
                isRunning = false;
                startBtn.textContent = 'ACTIVATE';
                clearInterval(timerInterval);
            } else {
                isRunning = true;
                startBtn.textContent = 'PAUSE';
                timerInterval = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateDisplay();
                    } else {
                        clearInterval(timerInterval);
                        isRunning = false;

                        if (!isBreak) {
                            sessionsCompleted++;
                            sessionsDisplay.textContent = sessionsCompleted;
                            isBreak = true;
                            timeLeft = 5 * 60;
                            totalTime = 5 * 60;
                            labelDisplay.textContent = 'REST MODE';
                            startBtn.textContent = 'ACTIVATE';
                        } else {
                            isBreak = false;
                            timeLeft = 25 * 60;
                            totalTime = 25 * 60;
                            labelDisplay.textContent = 'WORK MODE';
                            startBtn.textContent = 'ACTIVATE';
                        }
                        updateDisplay();
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            isBreak = false;
            timeLeft = 25 * 60;
            totalTime = 25 * 60;
            labelDisplay.textContent = 'WORK MODE';
            startBtn.textContent = 'ACTIVATE';
            updateDisplay();
        }

        startBtn.addEventListener('click', startTimer);
        resetBtn.addEventListener('click', resetTimer);

        updateDisplay();
    </script>
</body>
</html>
